name: KhulnaSoft Package Update

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      repositories:
        description: 'Comma-separated list of repositories to update (leave empty for all)'
        required: false
        type: string

jobs:
  update-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull_requests: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Configure KhulnaSoft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cp khulnasoft-config.json khulnasoft-config.local.json

    - name: Run package update workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        node .github/workflow_scripts/update-package.ts

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: package-update-results
        path: |
          package-update-results.json
        retention-days: 30
