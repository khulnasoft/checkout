name: KhulnaSoft Repository Sync

on:
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allow manual triggering
    inputs:
      repositories:
        description: 'Comma-separated list of repositories to sync (leave empty for all)'
        required: false
        type: string
      sync_configs:
        description: 'Sync repository configurations'
        required: false
        type: boolean
        default: true
      sync_workflows:
        description: 'Sync workflow files'
        required: false
        type: boolean
        default: true
      sync_templates:
        description: 'Sync issue/PR templates'
        required: false
        type: boolean
        default: true

jobs:
  sync-repositories:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
      issues: write
      pull_requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Configure KhulnaSoft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cp khulnasoft-config.json khulnasoft-config.local.json

    - name: Run repository sync workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SYNC_CONFIGS: ${{ github.event.inputs.sync_configs || 'true' }}
        SYNC_WORKFLOWS: ${{ github.event.inputs.sync_workflows || 'true' }}
        SYNC_TEMPLATES: ${{ github.event.inputs.sync_templates || 'true' }}
      run: |
        node .github/workflow_scripts/sync-repo.ts

    - name: Create sync report
      if: always()
      run: |
        echo "## Repository Sync Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "sync-results.json" ]; then
          echo "Sync completed successfully. Check artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
        else
          echo "Sync completed with some issues. Check logs for details." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload sync results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: repository-sync-results
        path: |
          sync-results.json
        retention-days: 30
