name: KhulnaSoft Template SHA Management

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering
    inputs:
      repositories:
        description: 'Comma-separated list of repositories to check (leave empty for all)'
        required: false
        type: string
      force_refresh:
        description: 'Force refresh SHAs even if not changed'
        required: false
        type: boolean
        default: false

jobs:
  manage-template-shas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Configure KhulnaSoft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cp khulnasoft-config.json khulnasoft-config.local.json

    - name: Run template SHA workflow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ORG: ${{ github.repository_owner }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
      run: |
        node .github/workflow_scripts/get-entry-server-template-shas.ts

    - name: Update SHA cache
      if: success()
      run: |
        # Cache the SHA results for other workflows to use
        echo "Template SHAs updated successfully"
        # In a real implementation, this would update a cache or database

    - name: Create SHA report
      if: always()
      run: |
        echo "## Template SHA Management Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "template-sha-results.json" ]; then
          echo "✅ Template SHA retrieval completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Summary:**" >> $GITHUB_STEP_SUMMARY
          echo "- Template SHAs have been refreshed" >> $GITHUB_STEP_SUMMARY
          echo "- Use cached SHAs in deployment workflows" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Template SHA retrieval completed with issues." >> $GITHUB_STEP_SUMMARY
          echo "Check logs for detailed error information." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload SHA results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: template-sha-results
        path: |
          template-sha-results.json
        retention-days: 7
